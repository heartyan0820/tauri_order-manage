name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NDK_VERSION: 26.1.10909125

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Android SDK 和 NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0 platform-tools platforms;android-34 ndk;26.1.10909125'

      - name: 设置 NDK_HOME
        run: echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> $GITHUB_ENV

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 安装前端依赖
        run: pnpm install

      - name: 生成 .env
        run: cp .env.example .env

      - name: 初始化 Android 工程
        run: pnpm tauri android init

      - name: 准备签名密钥
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "fixed=true" >> "$GITHUB_OUTPUT"
            echo "使用 Secrets 中的固定密钥"
          else
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.keystore" \
              -alias order-management -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass order123456 -keypass order123456 \
              -dname "CN=Order Management, OU=Dev, O=Dev, L=Beijing, ST=Beijing, C=CN"
            echo "fixed=false" >> "$GITHUB_OUTPUT"
            echo "Secrets 未配置，使用临时密钥（可下载 android-signing-keystore 产物固化签名）"
          fi

      - name: 构建 Release APK（仅 arm64-v8a）
        run: pnpm tauri android build --apk --target aarch64
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}

      - name: 签名 APK
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'order-management' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'order123456' }}
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -type f | head -n 1)
          echo "待签名: $APK"
          BT=${ANDROID_HOME}/build-tools/34.0.0
          "$BT/zipalign" -f 4 "$APK" "$APK.aligned"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KEY_PASSWORD" --key-pass pass:"$KEY_PASSWORD" \
            --out "$APK" "$APK.aligned"
          rm -f "$APK.aligned"
          "$BT/apksigner" verify "$APK"
          echo "签名完成并通过校验: $APK"

      - name: 查找 APK 文件
        run: |
          echo "=== 所有 APK 文件 ==="
          find src-tauri/gen/android/app/build/outputs -name "*.apk" -type f -exec ls -lh {} \;

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-release-arm64
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: 上传密钥文件（配置 Secrets 前的临时产物）
        if: steps.keystore.outputs.fixed == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-keystore
          path: ${{ runner.temp }}/release.keystore
          if-no-files-found: error
