name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NDK_VERSION: 26.1.10909125

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Android SDK 和 NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0 platform-tools platforms;android-34 ndk;26.1.10909125'

      - name: 设置 NDK_HOME
        run: echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> $GITHUB_ENV

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 安装前端依赖
        run: pnpm install

      - name: 生成 .env
        run: cp .env.example .env

      - name: 初始化 Android 工程
        run: pnpm tauri android init

      - name: 构建 Release APK（仅 arm64-v8a）
        run: pnpm tauri android build --apk --target aarch64
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}

      - name: 查找 APK 文件
        run: |
          echo "=== 所有 APK 文件 ==="
          find src-tauri/gen/android/app/build/outputs -name "*.apk" -type f -exec ls -lh {} \;

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-release-arm64
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
