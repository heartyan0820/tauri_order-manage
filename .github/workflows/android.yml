name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NDK_VERSION: 27.0.12077973

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Android SDK 和 NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0 platform-tools platforms;android-34 ndk;27.0.12077973'

      - name: 设置 NDK_HOME 环境变量
        run: |
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> $GITHUB_ENV
          echo "NDK_HOME is now: ${ANDROID_HOME}/ndk/${NDK_VERSION}"

      - name: 验证 NDK 安装
        run: |
          ls -la "${ANDROID_HOME}/ndk/${NDK_VERSION}"
          test -f "${NDK_HOME}/ndk-build" || (echo "NDK not found!" && exit 1)

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: 安装前端依赖
        run: pnpm install

      - name: 构建前端
        run: pnpm build

      - name: 删除旧的 Android 工程
        run: rm -rf src-tauri/gen/android

      - name: 初始化 Android 工程
        run: cargo tauri android init --ci

      - name: 构建 Android APK
        run: cargo tauri android build

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: app-universal-debug
          path: src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          if-no-files-found: error