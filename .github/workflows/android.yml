name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NDK_VERSION: 27.0.12077973

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 NDK 和构建工具
        shell: bash
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;35.0.0" "ndk;${NDK_VERSION}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            src-tauri/gen/android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 安装项目依赖
        run: pnpm install --frozen-lockfile

      - name: 初始化 Android 工程
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            pnpm tauri android init --ci
          else
            echo "Android 工程已存在，跳过初始化"
          fi
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          NDK_HOME: ${{ env.NDK_HOME }}

      - name: 构建 Debug APK
        shell: bash
        run: |
          set -o pipefail
          pnpm tauri android build --debug --verbose --target aarch64 2>&1 | tee android-build.log
          build_status=${PIPESTATUS[0]}
          echo "---- 构建错误摘要 ----"
          grep -nEi "FAILURE|error:|Could not|Caused by|What went wrong" android-build.log | tail -100 || true
          exit "$build_status"
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          NDK_HOME: ${{ env.NDK_HOME }}
          RUST_BACKTRACE: full

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android-build.log
          if-no-files-found: warn
          retention-days: 30