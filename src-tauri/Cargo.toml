[package]
name = "order-management"
version = "1.0.0"
description = "订单管理系统 - Tauri + Vue3 三端应用"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 系统托盘仅桌面端需要
[target.'cfg(desktop)'.dependencies]
tauri-plugin-tray-icon = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Release 体积优化配置
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
